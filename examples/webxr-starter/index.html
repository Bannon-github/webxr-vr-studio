<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebXR VR Studio — Starter</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0d12; color: #e8ecf5; font-family: system-ui, sans-serif; }
      #hud {
        position: fixed; left: 16px; bottom: 16px; z-index: 2;
        max-width: min(420px, 92vw); padding: 12px 14px; border-radius: 12px;
        background: rgba(10, 14, 22, 0.72); backdrop-filter: blur(8px);
        border: 1px solid rgba(255,255,255,0.08); line-height: 1.4; font-size: 14px;
      }
      #hud code { color: #9ad1ff; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <div id="hud">
      <strong>WebXR immersive-vr starter</strong><br />
      Three.js + Vite. Enter VR via the button (user gesture). Needs a secure context and WebXR support or an emulator.
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
